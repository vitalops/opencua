name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install sphinx myst-parser sphinx-book-theme sphinx-design linkify-it-py

      - name: Build docs
        run: |
          cd docs
          make docs
          touch build/html/.nojekyll

      - name: Deploy to gh-pages at /docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/build/html
          destination_dir: docs
          keep_files: true
